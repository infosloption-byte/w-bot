server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    add_header Content-Type application/json;
    return 200 '{"ready":true}';
  }

  # Public W-Bot marketing pages, built as separate HTML entrypoints.
  # They remain isolated from /portal/ customer sessions and platform auth.
  location = / { try_files /portal/marketing/index.html =404; }
  location = /favicon.svg { try_files /portal/favicon.svg =404; }
  location = /robots.txt { try_files /portal/robots.txt =404; }
  location = /sitemap.xml { try_files /portal/sitemap.xml =404; }

  location = /translation { return 308 /translation/; }
  location = /translation/ { try_files /portal/marketing/translation.html =404; }
  location = /smart-alerts { return 308 /smart-alerts/; }
  location = /smart-alerts/ { try_files /portal/marketing/smart-alerts.html =404; }
  location = /pricing { return 308 /pricing/; }
  location = /pricing/ { try_files /portal/marketing/pricing.html =404; }
  location = /how-it-works { return 308 /how-it-works/; }
  location = /how-it-works/ { try_files /portal/marketing/how-it-works.html =404; }
  location = /faq { return 308 /faq/; }
  location = /faq/ { try_files /portal/marketing/faq.html =404; }
  location = /trust { return 308 /trust/; }
  location = /trust/ { try_files /portal/marketing/trust.html =404; }
  location = /contact { return 308 /contact/; }
  location = /contact/ { try_files /portal/marketing/contact.html =404; }

  # Do not expose duplicate /portal/marketing/* URLs to search engines.
  location ^~ /portal/marketing/ { return 404; }

  location = /portal { return 308 /portal/; }

  location /portal/api/ {
    proxy_pass http://api:9028;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
    client_max_body_size 16k;
  }

  # Platform UI is a separate HTML entrypoint and does not share
  # customer authentication. Only /portal/api/platform/* serves its API.
  location = /portal/platform { return 308 /portal/platform/; }
  location /portal/platform/ { try_files /portal/platform.html =404; }

  location /portal/ {
    try_files $uri $uri/ /portal/index.html;
  }
}
