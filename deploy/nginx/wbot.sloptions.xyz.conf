# Host-level Nginx vhost for W-Bot on Lightsail.
# Point DNS first; issue a real certificate with certbot --nginx --redirect.
# The platform authentication locations are intentionally separate; do not
# remove the external access layer without replacing it (VPN/Zero Trust).
server {
    listen 80;
    server_name wbot.sloptions.xyz;

    # Public marketing homepage is served by the portal container at /.
    # The customer workspace still lives at /portal/; admin protections below are unchanged.
    # The generic location / proxy rule serves the public marketing routes.

    # Protect Platform Admin UI and APIs with a second, host-level login.
    # Use HTTPS before logging into either the platform or customer portal.
    location = /portal/platform { return 308 /portal/platform/; }
    location = /portal/api/platform { return 404; }
    location = /portal/platform.html { return 404; }

    location ^~ /portal/platform/ {
        auth_basic "W-Bot Platform Access";
        auth_basic_user_file /etc/nginx/.wbot-platform-users;
        proxy_pass http://127.0.0.1:9048;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location ^~ /portal/api/platform/ {
        auth_basic "W-Bot Platform Access";
        auth_basic_user_file /etc/nginx/.wbot-platform-users;
        proxy_pass http://127.0.0.1:9048;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Vite static assets, customer portal, customer APIs.
    # No trailing slash in proxy_pass: preserve /portal/... paths.
    location / {
        proxy_pass http://127.0.0.1:9048;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
